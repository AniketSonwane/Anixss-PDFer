<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Background Gradient for Browser Tabs -->
    <linearGradient id="favBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Vibrant Crimson Accent Gradient -->
    <linearGradient id="favRedGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Fold Corner Crimson Gradient -->
    <linearGradient id="favFoldGrad" x1="36" y1="9" x2="49" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Front Paper Gradient -->
    <linearGradient id="favPaperGrad" x1="15" y1="9" x2="49" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F6"/>
    </linearGradient>

    <!-- Crisp Drop Shadow for Front Document -->
    <filter id="favDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Shadow for Monogram A -->
    <filter id="monogramShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- High-Res Squircle Container (Stands out crisp on dark & light browser tabs) -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#favBgGrad)" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Back Layered Document Sheet (Depth & PDF Symbolism) -->
  <g transform="rotate(-6 32 31)">
    <rect x="18" y="9" width="29" height="42" rx="3.5" fill="#27272A" stroke="#52525B" stroke-width="1.2"/>
  </g>

  <!-- Front Document Sheet with Crisp 45-degree Fold -->
  <g filter="url(#favDropShadow)">
    <!-- Document Body -->
    <path d="M 15,12 A 3,3 0 0,1 18,9 L 36,9 L 49,22 L 49,50 A 3,3 0 0,1 46,53 L 18,53 A 3,3 0 0,1 15,50 Z" 
          fill="url(#favPaperGrad)" stroke="#E4E4E7" stroke-width="0.6"/>

    <!-- Folded Corner Flap with smooth inner arc -->
    <path d="M 36,9 L 36,19 A 3,3 0 0,0 39,22 L 49,22 Z" fill="url(#favFoldGrad)"/>
    <path d="M 36,22 L 49,22" stroke="#991B1B" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Monogram A Icon Centered on Document -->
  <g filter="url(#monogramShadow)">
    <!-- Main A Body (Solid Geometric Vector) -->
    <path d="M 30.2,18 L 33.8,18 L 43.5,47 L 38.5,47 L 35.8,38.5 L 28.2,38.5 L 25.5,47 L 20.5,47 Z 
             M 32,24.5 L 34.6,34.5 L 29.4,34.5 Z" 
          fill="#09090B" fill-rule="evenodd"/>

    <!-- Signature Crimson Accent Crossbar -->
    <rect x="23" y="35" width="18" height="3.6" rx="1.8" fill="url(#favRedGrad)"/>
  </g>
</svg>
